
plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id "fabric-loom" version "$fabric_loom_version"
}

base {
    archivesName = "${mod_id}"
}

dependencies {

    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_mc_version}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "com.google.code.findbugs:jsr305:3.0.1"
    implementation project(":common")
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}")))
    include(implementation 'com.github.Keksuccino:japng:0.5.3')
    include(implementation 'com.github.rtyley:animated-gif-lib-for-java:animated-gif-lib-1.7')
    modImplementation "maven.modrinth:watermedia:${watermedia_version}"
    modImplementation "maven.modrinth:watermedia-binaries:${watermedia_binaries_version}"
    modImplementation "maven.modrinth:melody:1.0.14-1.21.10-fabric"
    modImplementation "maven.modrinth:konkrete:1.9.13-1.21.10-fabric"
    modImplementation "maven.modrinth:modmenu:16.0.0-rc.1"
    modImplementation "it.crystalnest:fancy-entity-renderer-fabric:$fer_mc_version-$fer_version"
    modImplementation "de.keksuccino:rinku-fabric:3.0.4.1-1.21.10"

    //TODO 1.21.10：这行固定的是 Modrinth 的 version ID，绑死 1.21.11 构建。
    //     需要查 Sodium 的 1.21.10 版本 ID 后取消注释。
    //modImplementation "maven.modrinth:AANobbMI:NFkjnzWE" // Sodium
    //TODO 1.21.10：这行固定的是 Modrinth 的 version ID，绑死 1.21.11 构建。
    //     需要查 Sodium Extra 的 1.21.10 版本 ID 后取消注释。
    //modImplementation "maven.modrinth:PtjYWJkn:zmsIDdn6" // Sodium Extra
    //TODO 1.21.10：这行固定的是 Modrinth 的 version ID，绑死 1.21.11 构建。
    //     需要查 Lithium 的 1.21.10 版本 ID 后取消注释。
    //modImplementation "maven.modrinth:gvQqBUqZ:Ow7wA0kG" // Lithium
    //TODO 1.21.10：这行固定的是 Modrinth 的 version ID，绑死 1.21.11 构建。
    //     需要查 Iris 的 1.21.10 版本 ID 后取消注释。
    //modImplementation "maven.modrinth:YL57xq9U:fDpuVzVr" // Iris

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"

}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            displayName.set("Fabric Client")
            generateRunConfig.set(true)
            runDirectory.set(file("../run_client"))
        }
        server {
            server()
            displayName.set("Fabric Server")
            generateRunConfig.set(true)
            runDirectory.set(file("../run_server"))
        }
    }
}

tasks.named("compileJava", JavaCompile).configure {
    source(project(":common").sourceSets.main.allSource)
}
tasks.named("compileTestJava", JavaCompile).configure {
    enabled = true
    source(sourceSets.test.java)
    classpath = sourceSets.test.compileClasspath
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.withType(Test).configureEach {
    // Allow builds when there are test sources but no matching tests.
    failOnNoDiscoveredTests = false
}
tasks.named("test", Test).configure {
    enabled = true
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    workingDir(layout.buildDirectory.dir("test-working-directory"))
    doFirst {
        workingDir.mkdirs()
    }
    useJUnitPlatform()
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://" + System.getenv("local_maven")
        }
    }
}
